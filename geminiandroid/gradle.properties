android.useAndroidX=true
android.enableJetifier=true

# Increase memory for the Gradle Daemon to prevent OutOfMemoryError
# Using 4GB for heap and 512MB for metaspace
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel builds and configuration caching for speed
org.gradle.parallel=true
org.gradle.configuration-cache=true
