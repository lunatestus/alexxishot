name: Gemini Android Build

on:
  push:
    branches: [ "gemini" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        # The cache-read-only property can be used for PRs if needed
        # cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Build with Gradle
      run: |
        cd geminiandroid
        # Using the wrapper committed in the repo
        chmod +x gradlew || true
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gemini-vibe-player-debug
        path: geminiandroid/app/build/outputs/apk/debug/app-debug.apk
