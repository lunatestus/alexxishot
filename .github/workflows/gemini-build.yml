name: Build Android APK (Gemini Vibe)

on:
  push:
    branches: [ main, feature/gemini-android, feature/android-native ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        working-directory: ./geminiandroid
        run: |
          # Use the gradle wrapper in the geminiandroid folder
          if [ ! -f gradlew ]; then
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: geminiandroid/app/build/outputs/apk/debug/app-debug.apk
