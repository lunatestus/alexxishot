name: Gemini Android Build

on:
  push:
    branches: [ "gemini" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.6" # This will install and cache Gradle 8.6 automatically

    - name: Build with Gradle
      run: |
        cd geminiandroid
        # Using the gradle command installed by setup-gradle action
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gemini-vibe-player-debug
        path: geminiandroid/app/build/outputs/apk/debug/app-debug.apk
