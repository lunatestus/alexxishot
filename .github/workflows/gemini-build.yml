name: Gemini Android Build

on:
  push:
    branches: [ "gemini" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: |
        cd geminiandroid
        # Pin Gradle to 8.6 to ensure compatibility with AGP 8.2.2
        gradle wrapper --gradle-version 8.6
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gemini-vibe-player-debug
        path: geminiandroid/app/build/outputs/apk/debug/app-debug.apk
