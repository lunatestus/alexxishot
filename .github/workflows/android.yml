name: Build Android APK

on:
  push:
    branches: [ main, feature/android-native ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x geminiandroid/gradlew || true
        # Note: If gradlew doesn't exist yet (not committed), 
        # we might need to use a different approach or ensure it's generated.
        # But usually, it's committed.

      - name: Build with Gradle
        working-directory: ./geminiandroid
        run: |
          # If gradlew is missing, we can try to use a global gradle or 
          # just rely on the user committing it as standard practice.
          # For a fresh repo, we might need to run 'gradle wrapper' once locally.
          if [ ! -f gradlew ]; then
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: geminiandroid/app/build/outputs/apk/debug/app-debug.apk
